# Base de dados exclusiva dos testes; não utiliza o MySQL da aplicação.
spring.datasource.url=jdbc:h2:mem:servico_notificacoes_testes;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Os testes controlam quando o processamento é executado.
notificacao.processamento.ativo=false
notificacao.max-tentativas=3
notificacao.simulacao.falhas-antes-sucesso=0

# Credenciais fictícias; os testes não contactam o SMTP.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste@exemplo.pt
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
